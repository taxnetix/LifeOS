# LifeOS profile — FICTIONAL. This is the demo vault; every person, entity and
# number here is invented. Tests and documentation run against this so nothing
# real ever has to be.
schema: profile/1

jurisdiction: za
currency: ZAR
fiscal_year_end: "02-28"
timezone: Africa/Johannesburg

people:
  - ref: per_a_sample
    name: A Sample
    relation: self
  - ref: per_m_sample
    name: M Sample
    relation: spouse
  - ref: per_t_sample
    name: T Sample
    relation: child

entities:
  - ref: ent_sample_family_trust
    name: The Sample Family Trust
    form: trust
  - ref: ent_northwind
    name: Northwind Software (Pty) Ltd
    form: pty_ltd

communication:
  report_length: short
  tone: direct
  language: en-ZA

domains:
  identity: true
  living: true
  finance: true
  insurance: true
  investments: true
  assets: true
  tax: true
  estate: true
  trusts: true
  final-wishes: true
  readiness: true

packs: [trusts]

heartbeat:
  max_items: 5
  max_waves: 4
  quiet_journal: true

thresholds:
  variance_pct: 15
  agent_overload:
    avg_duration_ms: 120000
    failures_recent: 3
    open_loops: 10

github:
  enabled: true
  autofile: false
  priority_ceiling: 3

finance:
  category_floor: 0.90
